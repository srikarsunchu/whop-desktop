[package]
name = "whop-desktop"
version = "0.4.2"
description = "Whop Desktop — a native macOS command center for Whop businesses, built on the Whop CLI"
authors = ["srikarsunchu"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "whop_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
